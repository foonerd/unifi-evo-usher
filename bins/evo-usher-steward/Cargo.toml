[package]
name = "evo-usher-steward"
description = "The usher's steward: the evo steward composed with the usher's plugin set."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
evo = { workspace = true }
evo-auth-bearer = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-usher-about = { path = "../../crates/about" }
evo-usher-controller-unifi = { path = "../../plugins/org.evoframework.usher.controller.unifi" }
evo-usher-counter = { path = "../../plugins/org.evoframework.usher.counter" }
evo-usher-stock = { path = "../../plugins/org.evoframework.usher.stock" }
anyhow = "1"
# A password is kept as an Argon2id hash.
argon2 = "0.5"
# evo's routes are axum's, and the gate before them is a layer of it.
axum = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The unit's code is compared in constant time.
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
evo-usher-controller-unifi = { path = "../../plugins/org.evoframework.usher.controller.unifi", features = ["simulated"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
tempfile = "3"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[lints]
workspace = true
