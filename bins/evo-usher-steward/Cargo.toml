[package]
name = "evo-usher-steward"
description = "The usher's steward: the evo steward composed with the usher's plugin set."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
evo = { workspace = true }
evo-auth-bearer = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-projection-core = { workspace = true }
evo-runtime-http = { workspace = true }
evo-usher-about = { path = "../../crates/about" }
# With the simulated controller, which a unit started as a demo is given
# in the place of a controller.
evo-usher-controller-unifi = { path = "../../plugins/org.evoframework.usher.controller.unifi", features = ["simulated"] }
evo-usher-counter = { path = "../../plugins/org.evoframework.usher.counter" }
evo-usher-site = { path = "../../plugins/org.evoframework.usher.site" }
evo-usher-stock = { path = "../../plugins/org.evoframework.usher.stock" }
evo-usher-why = { path = "../../crates/why" }
anyhow = "1"
# A password is kept as an Argon2id hash.
argon2 = "0.5"
# evo's routes are axum's, and the gate before them is a layer of it.
axum = { version = "0.7", default-features = false }
# What a shelf is asked, and what it answers, travels as base64.
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# The limit of open files is read and raised through it, a password is
# typed on the terminal unseen, the account the program runs as is
# asked, and the program is told to end in order where it is to start
# again; evo builds on the same crate.
nix = { version = "0.30", default-features = false, features = ["resource", "signal", "term", "user"] }
# What a unit carries when it is moved is sealed with it; evo's TLS
# builds on the same crate.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A satellite's secret is kept as its SHA-256; evo builds on the same
# crate.
sha2 = "0.10"
# The unit's code is compared in constant time.
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
# The shelves a unit test stands in for are evo's trait, which is
# written with it; evo builds on the same crate.
async-trait = "0.1"
evo-usher-controller-unifi = { path = "../../plugins/org.evoframework.usher.controller.unifi", features = ["simulated"] }
evo-usher-site = { path = "../../plugins/org.evoframework.usher.site", features = ["samples"] }
# A test types a password at the program on a terminal of its own.
nix = { version = "0.30", default-features = false, features = ["term"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
tempfile = "3"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[lints]
workspace = true
