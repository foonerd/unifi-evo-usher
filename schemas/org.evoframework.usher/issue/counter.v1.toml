# Schema for the `issue.counter` shelf at shape version 1.
#
# The request types and payloads a plugin stocking `issue.counter` at
# shape 1 answers. Payloads are JSON objects, in and out.

schema_version = 1
rack = "issue"
shelf = "counter"
shape = 1

description = """
The counter where a guest is handed a voucher. It keeps the voucher
types on offer, each the terms a voucher is minted on under a name, and
hands out a voucher of one of them.

A voucher handed out is for the wireless network the shelf
`networks.directory` says vouchers are for. One assigned for handing out
goes first: it is held for its type on the shelf `stock.reserve`. With
none held, one is minted for the asking on the shelf
`access.controller`. The counter asks those shelves as any caller does.

Every voucher handed out is written down: which, of which type, when,
and whether it was held or minted. A hand-out is `{ id: string, type:
string, at: integer, held: bool }`, `at` in seconds since
1970-01-01T00:00:00Z. The record is kept through a restart, and keeps
the newest ten thousand.

A type is `{ name: string, minutes: integer, guests: integer | null,
megabytes: integer | null, down_kbps: integer | null, up_kbps: integer |
null }`: its name, which is also the note its vouchers carry on the
controller; how long a voucher gives access from the moment its first
guest is let in; how many guests may use one voucher; a data allowance;
a download and an upload limit. A limit that is null is not set.

A request that may succeed if asked again (the controller was not
reached, or a shelf did not answer) is refused as transient; one that
will not succeed as asked, as permanent.
"""

[[requests]]
request_type = "types"
description = """
The voucher types on offer. Returns `{ types: [type] }`, in the order
the types were first kept.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "put_type"
description = """
Keep a voucher type. Payload: a type, its limits optional. A type is
known by its name, taken without the spaces around it: one of a name
that is kept takes that one's place, and any other is kept after the
others. Returns `{ type: type }` as it is kept.

A name that is empty or longer than 64 characters, a voucher that lasts
no minute and a limit of 0 are refused, as is one type more than the
24 a counter offers. What the controller takes beyond that, it says when
a voucher is minted on the terms.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "drop_type"
description = """
Drop a voucher type. Payload `{ name: string }`. Returns `{ dropped:
bool }`: whether there was a type of that name. Vouchers minted on its
terms stay what they are.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "hand"
description = """
Hand out one voucher of a type. Payload `{ type: string }`, the type by
its name. Returns `{ voucher: { id: string, code: string }, type: type,
network: string, held: bool, at: integer }`: the voucher, by the
controller's identifier of it and the code a guest types; the terms of
its type; the name of the wireless network it is for; whether it was
held for the type or minted for the asking; and when it was handed out.

A voucher held for the type is handed out before one is minted, the
oldest first, and is handed out while the controller is away. Where the
reserve gives no answer, one is minted.

Refused as permanent for a type that is not kept and while no wireless
network is chosen for vouchers; nothing is taken or minted then. A
refusal of the shelf that mints is passed on as it was given.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "assign"
description = """
Assign a voucher the controller has for handing out. Payload `{ site:
string, id: string }`: the site, and the controller's identifier of the
voucher. Returns `{ type: type }`: the type the voucher is held for.

The type is the one the voucher's note names. Where no type of that name
is kept, one is, on the voucher's own terms. Where one is, its terms are
the voucher's, or the request is refused.

Refused as permanent for a voucher the controller does not have on that
site, one that has expired, one a guest has used, one with no note, one
of which the controller does not say how long it lasts, and one that is
held already or was handed out here before.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "handed"
description = """
What was handed out here. Payload `{ ids: [string] }`, the vouchers
asked about by the controller's identifiers of them; optional. Returns
`{ handed: [hand-out] }`: with `ids`, the hand-out of each of those
vouchers that was handed out here, in the order asked; with none, the
newest hundred hand-outs, the newest first.
"""
payload_in = "json"
payload_out = "json"

[[acceptance]]
name = "types-are-kept-in-their-order"
detail = """
After `put_type` of a, b and then a on other terms, `types` returns a on
its new terms, then b. After a restart of the plugin it returns the
same.
"""

[[acceptance]]
name = "terms-that-can-be-no-vouchers-are-not-kept"
detail = """
`put_type` with an empty name, with `minutes = 0` or with a limit of 0
is refused as permanent, and `types` returns what it did before.
"""

[[acceptance]]
name = "a-voucher-is-minted-on-the-terms-of-its-type"
detail = """
With none held for it, `hand` of a kept type asks `access.controller`
to mint one voucher, on the site of the chosen wireless network, with
the type's name as its note and the type's terms, and returns that
voucher.
"""

[[acceptance]]
name = "nothing-is-minted-for-no-network"
detail = """
While `networks.directory` says no wireless network is chosen, `hand` is
refused as permanent and `access.controller` is not asked.
"""

[[acceptance]]
name = "a-controller-that-is-away-is-a-refusal-for-now"
detail = """
Where `access.controller` refuses `mint` as transient, `hand` is refused
as transient, in the same words.
"""

[[acceptance]]
name = "a-held-voucher-goes-before-a-minted-one"
detail = """
With a voucher held for a type, `hand` of that type returns it with
`held: true` and `access.controller` is not asked to mint. With none
held, `hand` returns a minted one with `held: false`.
"""

[[acceptance]]
name = "a-voucher-assigned-brings-its-type"
detail = """
`assign` of an unused voucher whose note names no kept type keeps a type
of that name on the voucher's terms and holds the voucher for it; `hand`
of that type then returns that voucher.
"""

[[acceptance]]
name = "only-a-voucher-that-lets-a-guest-in-is-assigned"
detail = """
`assign` of a voucher that has expired, that a guest has used, that the
controller does not have, or whose terms are not those of the kept type
its note names, is refused as permanent and holds nothing.
"""

[[acceptance]]
name = "a-hand-out-is-written-down"
detail = """
After `hand` returned a voucher, `handed` with its identifier returns
its hand-out, with the type it was handed out as and whether it was
held, and does so after a restart of the plugin. `handed` with the
identifier of a voucher that was not handed out here returns none.
"""

[[acceptance]]
name = "a-voucher-handed-out-is-not-assigned"
detail = """
`assign` of a voucher that `hand` returned, held or minted, is refused
as permanent.
"""
