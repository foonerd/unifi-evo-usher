# Schema for the `issue.counter` shelf at shape version 1.
#
# The request types and payloads a plugin stocking `issue.counter` at
# shape 1 answers. Payloads are JSON objects, in and out.

schema_version = 1
rack = "issue"
shelf = "counter"
shape = 1

description = """
The counter where a guest is handed a voucher. It keeps the voucher
types an administrator defines, each the terms a voucher is issued on
under a name, and hands out a voucher of one of them.

A voucher handed out is for the wireless network the shelf
`networks.directory` says vouchers are for. One assigned for handing out
goes first: it is held for its type on the shelf `stock.reserve`. With
none held, one is minted for the asking on the shelf
`access.controller`. The counter asks those shelves as any caller does.

Every voucher handed out is written down: which, of which type, when,
and whether it was held or minted. A hand-out is `{ id: string, type:
string, at: integer, held: bool }`, `at` in seconds since
1970-01-01T00:00:00Z. The record is kept through a restart, and keeps
the newest ten thousand.

A type is `{ name: string, minutes: integer, guests: integer | null,
megabytes: integer | null, down_kbps: integer | null, up_kbps: integer |
null, up_to_days?: true, up_to_guests?: true }`: its name, which is also
the note its vouchers carry on the controller; how long a voucher gives
access from the moment its first guest is let in; how many devices may
use one voucher; a data allowance; a download and an upload limit. A
limit that is null is not set.

The days and the number of devices of a type are fixed, or are chosen
for each voucher by whoever issues it. Where `up_to_days` is true, a
voucher is issued for 1 day up to the days `minutes` comes to, which is
a whole number of days and 2 at least. Where `up_to_guests` is true, it
is issued for 1 device up to `guests`, which is 2 at least. A type with
neither is fixed: a voucher of it is issued as the type stands.

Each type is enabled for the front desk or not; one that is defined is
enabled. One type is the default: the one a point of issue with a single
button issues. Only a fixed, enabled type can be the default. While no
type is the default, the first that can be becomes it. The default is
not deleted, disabled or given a choice while another type could be the
default: another is made the default first.

A request that may succeed if asked again (the controller was not
reached, or a shelf did not answer) is refused as transient; one that
will not succeed as asked, as permanent.
"""

[[requests]]
request_type = "types"
description = """
The voucher types as the administrator sees them. Returns `{ types:
[type], default: string | null, disabled: [string] }`: every type in the
order they were first defined, the name of the default, and the names of
the types that are not enabled for the front desk.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "offered"
description = """
The voucher types a front desk is offered. Returns `{ types: [type],
default: string | null }`: the enabled types, in their order, and the
name of the default.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "put_type"
description = """
Define a voucher type, or change one. Payload: a type, its limits and
its choices optional. A type is known by its name, taken without the
spaces around it: one of a name that is kept takes that one's place, and
any other is kept after the others, enabled. Returns `{ type: type }` as
it is kept.

A name that is empty or longer than 64 characters, a voucher that lasts
no minute, a limit of 0, days to choose that are no whole days or fewer
than 2, and devices to choose that are fewer than 2 are refused, as is
one type more than the 24 a counter keeps. What the controller takes
beyond that, it says when a voucher is issued on the terms.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "drop_type"
description = """
Delete a voucher type. Payload `{ name: string }`. Returns `{ dropped:
bool }`: whether there was a type of that name. Vouchers issued on its
terms stay what they are.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "enable_type"
description = """
Enable a voucher type for the front desk, or disable it. Payload `{
name: string, enabled: bool }`. Returns `{ name: string, enabled: bool,
default: string | null }`. A disabled type stays defined, with its
terms, and is not among what `offered` returns.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "set_default"
description = """
Make a voucher type the default. Payload `{ name: string }`. Returns `{
default: string }`. Refused for a type with days or devices to choose,
and for one that is disabled.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "hand"
description = """
Hand out one voucher of a type. Payload `{ type: string, days?:
integer, guests?: integer }`: the type by its name, and what is chosen
for this voucher where the type has days or devices to choose. Returns
`{ voucher: { id: string, code: string }, type: type,
network: string, join: { text: string, side: integer, rows: [string] } |
null, held: bool, at: integer }`: the voucher, by the controller's
identifier of it and the code a guest types; the terms it was issued
on, the type's with what was chosen; the name of the wireless network it
is for; what a phone joins that network
from; whether the voucher was held for the type or minted for the
asking; and when it was handed out.

`join` is given for a network that `networks.directory` says is joined
`open`: `text` is the text a phone joins it from, and `rows` the QR
symbol that carries the text, `side` rows of `side` characters, a `1`
for each dark module. For a network joined any other way, or of which
the choice does not say how it is joined, `join` is null.

A voucher held for the type is handed out before one is minted, the
oldest first, and is handed out while the controller is away. Where the
reserve gives no answer, one is minted. No voucher is held for a type
with a choice: one is minted on what was chosen.

Refused as permanent for a type that is not kept, for a choice the type
does not offer, one left out or one beyond what the type allows, and
while no wireless network is chosen for vouchers; nothing is taken or minted then. A
refusal of the shelf that mints is passed on as it was given.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "assign"
description = """
Assign a voucher the controller has for handing out. Payload `{ site:
string, id: string }`: the site, and the controller's identifier of the
voucher. Returns `{ type: type }`: the type the voucher is held for.

The type is the one the voucher's note names. Where no type of that name
is kept, one is, on the voucher's own terms. Where one is, its terms are
the voucher's, or the request is refused.

Refused as permanent for a voucher the controller does not have on that
site, one that has expired, one a guest has used, one with no note, one
of which the controller does not say how long it lasts, and one that is
held already or was handed out here before.
"""
payload_in = "json"
payload_out = "json"

[[requests]]
request_type = "handed"
description = """
What was handed out here. Payload `{ ids: [string] }`, the vouchers
asked about by the controller's identifiers of them; optional. Returns
`{ handed: [hand-out] }`: with `ids`, the hand-out of each of those
vouchers that was handed out here, in the order asked; with none, the
newest hundred hand-outs, the newest first.
"""
payload_in = "json"
payload_out = "json"

[[acceptance]]
name = "types-are-kept-in-their-order"
detail = """
After `put_type` of a, b and then a on other terms, `types` returns a on
its new terms, then b. After a restart of the plugin it returns the
same.
"""

[[acceptance]]
name = "terms-that-can-be-no-vouchers-are-not-kept"
detail = """
`put_type` with an empty name, with `minutes = 0` or with a limit of 0
is refused as permanent, and `types` returns what it did before.
"""

[[acceptance]]
name = "a-voucher-is-minted-on-the-terms-of-its-type"
detail = """
With none held for it, `hand` of a kept type asks `access.controller`
to mint one voucher, on the site of the chosen wireless network, with
the type's name as its note and the type's terms, and returns that
voucher.
"""

[[acceptance]]
name = "nothing-is-minted-for-no-network"
detail = """
While `networks.directory` says no wireless network is chosen, `hand` is
refused as permanent and `access.controller` is not asked.
"""

[[acceptance]]
name = "a-controller-that-is-away-is-a-refusal-for-now"
detail = """
Where `access.controller` refuses `mint` as transient, `hand` is refused
as transient, in the same words.
"""

[[acceptance]]
name = "a-held-voucher-goes-before-a-minted-one"
detail = """
With a voucher held for a type, `hand` of that type returns it with
`held: true` and `access.controller` is not asked to mint. With none
held, `hand` returns a minted one with `held: false`.
"""

[[acceptance]]
name = "a-voucher-assigned-brings-its-type"
detail = """
`assign` of an unused voucher whose note names no kept type keeps a type
of that name on the voucher's terms and holds the voucher for it; `hand`
of that type then returns that voucher.
"""

[[acceptance]]
name = "only-a-voucher-that-lets-a-guest-in-is-assigned"
detail = """
`assign` of a voucher that has expired, that a guest has used, that the
controller does not have, or whose terms are not those of the kept type
its note names, is refused as permanent and holds nothing.
"""

[[acceptance]]
name = "a-hand-out-is-written-down"
detail = """
After `hand` returned a voucher, `handed` with its identifier returns
its hand-out, with the type it was handed out as and whether it was
held, and does so after a restart of the plugin. `handed` with the
identifier of a voucher that was not handed out here returns none.
"""

[[acceptance]]
name = "a-voucher-handed-out-is-not-assigned"
detail = """
`assign` of a voucher that `hand` returned, held or minted, is refused
as permanent.
"""

[[acceptance]]
name = "an-open-network-is-joined-from-the-voucher"
detail = """
With an open wireless network chosen, `hand` returns a `join` whose
`text` joins that network without a passphrase and whose `rows` are a
square of `side`. With a network joined by a passphrase chosen, or one
kept without how it is joined, `join` is null.
"""
