[package]
name = "evo-usher-printing"
description = "The printers a voucher is put on paper by, and which point of issue prints on which: a singleton respondent on the printing.labels shelf of the evo steward."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
evo-plugin-sdk = { workspace = true }
evo-usher-printer = { path = "../../crates/printer" }
evo-usher-render = { path = "../../crates/render" }
evo-usher-why = { path = "../../crates/why" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
evo-plugin-test = { workspace = true }
toml = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
