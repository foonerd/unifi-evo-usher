[plugin]
name = "org.evoframework.usher.counter"
# The crate's version, which is the workspace's. The steward refuses a
# plugin that says another version than its manifest; a test holds the two
# together.
version = "0.3.21"
contract = 1

[target]
shelf = "issue.counter"
shape = 1

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "in-process"
exec = "<compiled-in>"

[trust]
class = "platform"

[prerequisites]
evo_min_version = "0.1.13"
os_family = "any"
# Speaks to nothing but the steward's other shelves.
outbound_network = false
# Reads and writes its own state directory only.
filesystem_scopes = []

[resources]
max_memory_mb = 16
max_cpu_percent = 1

[lifecycle]
hot_reload = "restart"
autostart = true
restart_on_crash = true
restart_budget = 5

# Handing out and assigning wait on the controller, through its shelf:
# the budget is that shelf's, and a little over.
[capabilities.respondent]
request_types = ["types", "offered", "put_type", "drop_type", "enable_type", "set_default", "order_types", "hand", "hand_default", "hand_type", "assign", "handed"]
response_budget_ms = 35000

# Who may ask. A voucher is what lets a guest on to the network, and its
# types are the terms it is minted on, so whatever defines the types,
# assigns a voucher or reads what was handed out asks for the
# network_admin capability. The two requests a front desk makes, the
# types on offer and a voucher handed out, ask for a capability of the
# usher's own, voucher_issue, which a session of a person at the front
# desk is given and nothing else of the kind. It is declared as a step-up,
# the one kind of a plugin's capability a bearer can be made with. The
# one request a satellite makes, the default voucher handed out, asks
# for a capability of its own, voucher_default, which a satellite's
# session is given and nothing else: a satellite hands out no other
# type, and is told nothing of the types. A satellite an administrator
# gave types of its own asks for one of them by name, under a third
# capability, voucher_named, which only the session of such a satellite
# is given: no other satellite's session is good for a type that is
# named.
[capabilities.respondent.verb_capabilities]
types = { kind = "read", scope = "network_admin" }
offered = { kind = "read", scope = "voucher_issue" }
put_type = { kind = "write", scope = "network_admin" }
drop_type = { kind = "write", scope = "network_admin" }
enable_type = { kind = "write", scope = "network_admin" }
set_default = { kind = "write", scope = "network_admin" }
order_types = { kind = "write", scope = "network_admin" }
hand = { kind = "step_up", scope = "voucher_issue" }
hand_default = { kind = "step_up", scope = "voucher_default" }
hand_type = { kind = "step_up", scope = "voucher_named" }
assign = { kind = "write", scope = "network_admin" }
handed = { kind = "read", scope = "network_admin" }

# On the screen: the counter itself, and the types it offers under it.
[[ui.stocks]]
ui_shelf = "issue.counter"
widget = "usher.counter"
size = "full"

[[ui.stocks]]
ui_shelf = "issue.counter"
widget = "usher.types"
size = "full"
