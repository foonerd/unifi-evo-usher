[package]
name = "evo-usher-site"
description = "What the place a unit serves is called, how it looks and what time it keeps: a singleton respondent on the site.settings shelf of the evo steward."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# A PNG file made here, for a test that needs a logo to give: the usher
# reads a PNG, and makes none anywhere else.
samples = []

[dependencies]
evo-plugin-sdk = { workspace = true }
evo-usher-why = { path = "../../crates/why" }
# A logo travels as base64 in a request's payload.
base64 = "0.22"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
evo-plugin-test = { workspace = true }
toml = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
