[package]
name = "evo-usher-stock"
description = "The reserve of vouchers ready to hand out: a singleton respondent on the stock.reserve shelf of the evo steward."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
evo-plugin-sdk = { workspace = true }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
