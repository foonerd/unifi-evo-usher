[plugin]
name = "org.evoframework.usher.stock"
# The crate's version, which is the workspace's. The steward refuses a
# plugin that says another version than its manifest; a test holds the two
# together.
version = "0.3.25"
contract = 1

[target]
shelf = "stock.reserve"
shape = 1

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "in-process"
exec = "<compiled-in>"

[trust]
class = "platform"

[prerequisites]
evo_min_version = "0.1.12"
os_family = "any"
outbound_network = false
# Reads and writes its own state directory only.
filesystem_scopes = []

[resources]
max_memory_mb = 16
max_cpu_percent = 1

[lifecycle]
hot_reload = "restart"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.respondent]
request_types = ["put", "take", "count", "held", "release"]
response_budget_ms = 1000

# Who may ask. A voucher is what lets a guest on to the network, so putting
# vouchers in and taking one out ask for the network_admin capability: a
# caller the steward trusts only for being on the same network is refused.
# How many vouchers are held is what the counter's page says beside each
# type: it asks for voucher_issue, the capability the session of a person
# at the front desk holds, and an administrator's with it. Which they are
# is an administrator's to read, for their codes are what lets a guest
# on.
[capabilities.respondent.verb_capabilities]
put = { kind = "write", scope = "network_admin" }
take = { kind = "write", scope = "network_admin" }
count = { kind = "read", scope = "voucher_issue" }
held = { kind = "read", scope = "network_admin" }
release = { kind = "write", scope = "network_admin" }
