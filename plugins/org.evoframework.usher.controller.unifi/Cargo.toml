[package]
name = "evo-usher-controller-unifi"
description = "A UniFi Network controller as the usher's controller: a singleton respondent on the access.controller shelf of the evo steward."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# A controller written from Ubiquiti's description of the API, to hold the
# plugin to in tests. Not part of what ships.
simulated = ["dep:rcgen"]

[dependencies]
evo-plugin-sdk = { workspace = true }
hex = "0.4"
rcgen = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
evo-plugin-test = { workspace = true }
toml = "0.8"
evo-usher-controller-unifi = { path = ".", features = ["simulated"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
