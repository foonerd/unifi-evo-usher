name: release

# A tag builds the release: the workshop pass, every architecture built with
# its proof on a machine of its own, then one job that holds each build
# against its manifest, packs the archives and the packages and proves the
# image, then the steward's package installed and run as a service on a
# machine of each architecture, the Debian package on the machine itself
# and the RPM in a container of an RPM system that systemd runs, and last
# the job that signs what was proven and publishes the image under the
# version and a pre-release. Run by hand it builds, packs and proves
# everything and publishes nothing; the packages are kept with the run.
# Every job has a time limit several times what it takes: one that hangs
# is stopped at it and fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the workspace is $version" >&2; exit 1; }
      - name: The toolchain rust-toolchain.toml names
        run: scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: false
      # The tool the notices of the libraries are made with, kept from
      # run to run: scripts/check.sh holds the notices to what it makes.
      - uses: actions/cache@v6
        id: about
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}-${{ runner.arch }}
      - name: The tool the notices are made with
        if: steps.about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --version 0.9.3
      - run: scripts/check.sh

  build:
    name: ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: The toolchain rust-toolchain.toml names
        run: scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.arch }}
          cache-bin: false
          save-if: false
      - name: The C compiler a static program is built with
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: scripts/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: unifi-evo-usher-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          if-no-files-found: error

  package:
    name: packages and the image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: unifi-evo-usher-*
          path: artifacts
      # The artifact store keeps no file modes; the programs are made
      # runnable again, and package.sh holds each against its digest.
      - name: What the builds made, where the scripts look for it
        run: |
          mkdir -p out
          for arch in amd64 arm64; do mv "artifacts/unifi-evo-usher-$arch" "out/$arch"; done
          chmod 755 out/*/bin/*
          ls -la out/*/bin
      - name: The tool an RPM is made with
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: scripts/package.sh
      - run: scripts/image.sh --check
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist
          if-no-files-found: error

  unit:
    name: a unit, ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      # The machine is made for the run and thrown away after it: the
      # package is installed on it as on any unit.
      - name: The steward's package, installed and run as a service
        run: sudo scripts/prove-unit.sh dist/evo-usher-steward_*_${{ matrix.arch }}.deb

  unit-rpm:
    name: a unit from the RPM, ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, machine: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, machine: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      # The machine is Ubuntu's, so the RPM is installed where one
      # belongs: in a container of AlmaLinux 9 that systemd runs, made
      # for the run and thrown away after it.
      - name: The steward's RPM, installed and run as a service
        run: scripts/prove-unit-rpm.sh dist/evo-usher-steward-*.${{ matrix.machine }}.rpm

  publish:
    name: sign, publish
    needs: [unit, unit-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      # What the builds made, for the image, and the packages that were
      # proven, which are the ones that are signed and published.
      - uses: actions/download-artifact@v8
        with:
          pattern: unifi-evo-usher-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      # The artifact store keeps no file modes; the programs are made
      # runnable again.
      - name: What the builds made, where the scripts look for it
        run: |
          mkdir -p out
          for arch in amd64 arm64; do mv "artifacts/unifi-evo-usher-$arch" "out/$arch"; done
          chmod 755 out/*/bin/*
          ls -la out/*/bin dist
      # Every archive carries MANIFEST and its signature; SHA256SUMS and its
      # signature stand beside the assets. The private key comes from the
      # repository's secret RELEASE_SIGNING_KEY (the Ed25519 key as PEM); the
      # public key the repository carries (keys/release-signing.pub) checks
      # every signature before anything is published. A release of
      # unifi-evo-usher is never published unsigned.
      - name: Sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release of unifi-evo-usher is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - uses: actions/upload-artifact@v7
        with:
          name: unifi-evo-usher-release
          path: dist
          if-no-files-found: error
      # The image under the version and no other tag: which version is the
      # latest is said by hand, once the release has been tried.
      - name: Publish the image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          scripts/image.sh --push
      # Published as a pre-release. It is made the latest by hand once it
      # has been tried (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          { scripts/release-notes.sh "$version"; printf '\n'; cat .github/release-footer.md; } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --title "unifi-evo-usher $version" --notes-file dist/notes.md --prerelease \
            dist/unifi-evo-usher-*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS dist/SHA256SUMS.sig
