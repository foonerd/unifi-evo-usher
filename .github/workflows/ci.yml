name: ci

# Every push: the workshop pass, then every architecture built on a machine
# of its own (nothing is emulated) with its proof, then the packages and
# the image made from what was built, then the steward's package installed
# and run as a service on a machine of each architecture, the Debian
# package on the machine itself and the RPM in a container of an RPM
# system that systemd runs; and the image run as a unit in a container,
# alone and behind each proxy the repository has an example for. What was
# built and what was packed are kept with the run. Every job has a time
# limit several times what it takes: one that hangs is stopped at it and
# fails, and holds the run no longer.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The toolchain rust-toolchain.toml names
        run: scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The tool the notices of the libraries are made with, kept from
      # run to run: scripts/check.sh holds the notices to what it makes.
      - uses: actions/cache@v6
        id: about
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}-${{ runner.arch }}
      - name: The tool the notices are made with
        if: steps.about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --version 0.9.3
      - run: scripts/check.sh

  build:
    name: ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: The toolchain rust-toolchain.toml names
        run: scripts/toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.arch }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The C compiler a static program is built with
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: scripts/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: unifi-evo-usher-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          if-no-files-found: error

  package:
    name: packages and the image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: unifi-evo-usher-*
          path: artifacts
      # The artifact store keeps no file modes; the programs are made
      # runnable again, and package.sh holds each against its digest.
      - name: What the builds made, where the scripts look for it
        run: |
          mkdir -p out
          for arch in amd64 arm64; do mv "artifacts/unifi-evo-usher-$arch" "out/$arch"; done
          chmod 755 out/*/bin/*
          ls -la out/*/bin
      - name: The tool an RPM is made with
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: scripts/package.sh
      - run: scripts/image.sh --check
      - uses: actions/upload-artifact@v7
        with:
          name: unifi-evo-usher-packages
          path: dist
          if-no-files-found: error

  container:
    name: a unit in a container, alone and behind each proxy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unifi-evo-usher-amd64
          path: out/amd64
      # The artifact store keeps no file modes.
      - name: What the build made, runnable again
        run: chmod 755 out/amd64/bin/*
      - name: The image, for this machine
        run: scripts/image.sh --here
      # The Compose file and the proxy examples as they stand in the
      # repository: the unit under the least privilege, then behind
      # nginx, Apache httpd, Caddy and Traefik, asked as a browser asks.
      - name: The unit alone, then behind each proxy
        run: scripts/prove-proxy.sh

  unit:
    name: a unit, ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unifi-evo-usher-packages
          path: dist
      # The machine is made for the run and thrown away after it: the
      # package is installed on it as on any unit.
      - name: The steward's package, installed and run as a service
        run: sudo scripts/prove-unit.sh dist/evo-usher-steward_*_${{ matrix.arch }}.deb

  unit-rpm:
    name: a unit from the RPM, ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, machine: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, machine: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unifi-evo-usher-packages
          path: dist
      # The machine is Ubuntu's, so the RPM is installed where one
      # belongs: in a container of AlmaLinux 9 that systemd runs, made
      # for the run and thrown away after it.
      - name: The steward's RPM, installed and run as a service
        run: scripts/prove-unit-rpm.sh dist/evo-usher-steward-*.${{ matrix.machine }}.rpm
