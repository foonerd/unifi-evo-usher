# What cargo-about goes by when scripts/notices.sh makes the notices of
# the libraries the usher's programs contain.

# The licences the programs' libraries come under. A library under any
# other stops the notices from being made, so that a licence nobody has
# looked at is not taken in unseen.
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense",
    "CC0-1.0", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
    # The evo framework's own crates. Their licence goes with the steward
    # as LICENSE-evo.txt as well.
    "BUSL-1.1",
]

# The programs as they are built and shipped, and what is linked into
# them: not what only builds or tests them.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The usher's own crates are no library of another: their licence is the
# project's own, LICENSE.
private = { ignore = true }
