[workspace]
resolver = "2"
members = [
    "crates/about",
    "crates/printer",
    "crates/render",
    "crates/why",
    "bins/evo-usher-core",
    "bins/evo-usher-station",
    "bins/evo-usher-steward",
    "plugins/org.evoframework.usher.controller.unifi",
    "plugins/org.evoframework.usher.counter",
    "plugins/org.evoframework.usher.site",
    "plugins/org.evoframework.usher.stock",
]

[workspace.package]
version = "0.3.17"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/foonerd/unifi-evo-usher"

# The evo framework, pinned to one release: the steward the usher is
# composed on, and the SDK its plugins are written against. 0.1.13.1 is
# the first that lets a distribution withhold the privilege evo gives a
# caller on the LAN; 0.1.13.2 the first that tells a plugin by name why
# the steward refused what it asked of another shelf.
[workspace.dependencies]
evo = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }
evo-plugin-sdk = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }
evo-plugin-test = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }
evo-auth-bearer = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }
# What evo hands a distribution's hookup to ask a shelf with: the usher's
# own routes ask the catalogue's shelves through it, as any caller does.
evo-runtime-http = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }
evo-projection-core = { git = "https://github.com/foonerd/evo-core.git", tag = "v0.1.13.2" }

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

# The SDK's traits return `impl Future + Send`, which a plugin has to write
# out; the rewrite this lint proposes does not satisfy them.
[workspace.lints.clippy]
manual_async_fn = "allow"

# A build for development names the file and the line in a backtrace and
# carries no more of a debugger's information: every test program links
# the whole steward, and with full information each one is twice the size.
[profile.dev]
debug = "line-tables-only"

# Hashing a password is made to cost; built without optimisation it costs
# more than a test of signing in can wait on.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# What ships carries no symbols: the programs name their own commit and
# target, and a release names its build in build.json.
[profile.release]
strip = true
