[workspace]
resolver = "2"
members = [
    "crates/about",
    "crates/printer",
    "crates/render",
    "bins/evo-usher-core",
    "bins/evo-usher-station",
    "bins/evo-usher-steward",
    "plugins/org.evoframework.usher.controller.unifi",
    "plugins/org.evoframework.usher.stock",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/foonerd/unifi-evo-usher"

# The evo framework, pinned to one commit: the steward the usher is
# composed on, and the SDK its plugins are written against. The commit is
# on evo-core-eng's v0.1.13.1 line, the first that lets a distribution
# withhold the privilege evo gives a caller on the LAN.
[workspace.dependencies]
evo = { git = "https://github.com/foonerd/evo-core-eng.git", rev = "9f8ca1c58b116e3c2308bb6f69fe5eac18bb196a" }
evo-plugin-sdk = { git = "https://github.com/foonerd/evo-core-eng.git", rev = "9f8ca1c58b116e3c2308bb6f69fe5eac18bb196a" }
evo-plugin-test = { git = "https://github.com/foonerd/evo-core-eng.git", rev = "9f8ca1c58b116e3c2308bb6f69fe5eac18bb196a" }

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

# The SDK's traits return `impl Future + Send`, which a plugin has to write
# out; the rewrite this lint proposes does not satisfy them.
[workspace.lints.clippy]
manual_async_fn = "allow"

# What ships carries no symbols: the programs name their own commit and
# target, and a release names its build in build.json.
[profile.release]
strip = true
