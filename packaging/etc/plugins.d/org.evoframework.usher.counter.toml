# The voucher types this unit offers from its first start: the ones its
# administrator predefines. Each [[types]] table is one type.
#
#   name       what the type is called at the counter; it is also the
#              note a voucher of the type carries on the controller
#   minutes    how long a voucher gives access, from the moment its first
#              guest is let in
#   guests     how many guests may use one voucher; any number where it
#              is left out
#   megabytes  the data allowance; none where it is left out
#   down_kbps  the download limit, in kilobits per second; none where it
#              is left out
#   up_kbps    the upload limit, in kilobits per second; none where it is
#              left out
#
# The predefined types stand before the ones kept from the screen, in the
# order they are written in here, and are changed here alone: the screen
# shows them and neither keeps one over them nor drops one. The steward
# reads this file when it starts:
#
#   sudo systemctl restart evo.service
#
# A file that predefines none leaves the counter with the types kept
# from the screen.

[[types]]
name = "One hour"
minutes = 60
guests = 1

[[types]]
name = "One day"
minutes = 1440
guests = 1

[[types]]
name = "One week"
minutes = 10080
guests = 1
