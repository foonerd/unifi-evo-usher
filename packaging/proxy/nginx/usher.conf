# nginx in front of the usher: the site's certificate towards the
# browser, HTTPS towards the unit.
#
# The unit's own certificate is signed by the unit's authority and names
# the unit `localhost`: nginx holds it to that authority and that name.
# The steward's line of happenings is a WebSocket at /api/v1/ws; the
# browser names its bearer in Sec-WebSocket-Protocol, which nginx passes
# on with the other headers.

map $http_upgrade $usher_connection {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    # The name the site gives the usher.
    server_name usher.example.org;

    ssl_certificate     /usher/site.crt;
    ssl_certificate_key /usher/site.key;

    # The file a unit is moved by is long: nginx passes one megabyte on
    # unless it is told more, and the unit reads sixty-four at most.
    client_max_body_size 80m;

    location / {
        proxy_pass https://usher:8443;

        proxy_ssl_trusted_certificate /usher/unit-ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                localhost;
        proxy_ssl_server_name         on;

        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $usher_connection;

        # A screen that is open keeps its line open.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
