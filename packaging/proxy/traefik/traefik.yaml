# Traefik in front of the usher: what Traefik itself is told. What it is
# told of the usher is in usher.yaml, read from a file, so Traefik needs
# no way to the Docker socket.

entryPoints:
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic

log:
  level: WARN
