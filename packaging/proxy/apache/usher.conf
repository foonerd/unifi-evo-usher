# Apache httpd in front of the usher: the site's certificate towards the
# browser, HTTPS towards the unit. A whole httpd.conf for the httpd
# image; on a server that has one already, the virtual host is the part
# to take.
#
# The unit's own certificate is signed by the unit's authority and names
# the unit `localhost`. httpd holds it to that authority. It has no
# setting for the name to expect of a backend, so the name is not
# checked: SSLProxyCheckPeerName and SSLProxyCheckPeerCN are off.
# The steward's line of happenings is a WebSocket at /api/v1/ws, which
# mod_proxy_http passes on with `upgrade=websocket` (httpd 2.4.47 and
# later).

ServerRoot "/usr/local/apache2"
Listen 443
ServerName usher.example.org

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User www-data
Group www-data
ErrorLog /proc/self/fd/2
LogLevel warn

<VirtualHost *:443>
    # The name the site gives the usher.
    ServerName usher.example.org

    SSLEngine on
    SSLCertificateFile    /usher/site.crt
    SSLCertificateKeyFile /usher/site.key

    SSLProxyEngine on
    SSLProxyCACertificateFile /usher/unit-ca.crt
    SSLProxyVerify require
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off

    ProxyPreserveHost On
    # A screen that is open keeps its line open.
    ProxyTimeout 3600
    ProxyPass        / https://usher:8443/ upgrade=websocket
    ProxyPassReverse / https://usher:8443/
</VirtualHost>
