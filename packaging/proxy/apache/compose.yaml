# The usher behind Apache httpd, which holds the site's certificate and speaks
# HTTPS to the unit, believing it by the unit's own authority, though not by its name.
#
#   docker compose up -d --wait usher
#   docker compose cp usher:/var/lib/evo/state/https/ca.crt ./unit-ca.crt
#   docker compose up -d
#
# beside the files `site.crt` and `site.key`, and a file `.env` that
# names the version, which packaging/docker/.env.example is a model of.
# The unit makes its authority when it first starts, which is why it is
# started first. Whoever opens the face first sets the unit up, with a
# name and a password. docs/deploying.md says the rest.
#
#   USHER_VERSION       the version to run; there is no "latest"
#   USHER_IMAGE         the image, where it is not ghcr.io/foonerd/unifi-evo-usher
#   USHER_NAME          the name of the container and of the unit (default usher)
#   USHER_SITE_NAME     what the place is called, until one is saved on the page Site
#   USHER_TIME_ZONE     the time zone it keeps, as Europe/Warsaw, until one is saved there
#   USHER_LANGUAGE      the language it speaks, as en or de, until one is saved there
#   USHER_DEMO          1 runs it as a demo, on a simulated controller (default: a unit)
#   USHER_AUTHORITY     the unit's authority (default ./unit-ca.crt)
#   SITE_CERT, SITE_KEY the site's certificate and its key (default ./site.crt, ./site.key)
#   SITE_ADDRESS        the address the proxy is published on (default: every one)
#   SITE_PORT           the port it is published on (default 443)
services:
  usher:
    # The unit, as packaging/docker/compose.yaml has it and says of each
    # line what it is for, but for the port: behind a proxy the unit
    # publishes none.
    image: ${USHER_IMAGE:-ghcr.io/foonerd/unifi-evo-usher}:${USHER_VERSION:?name the version of the usher to run, as USHER_VERSION}
    container_name: ${USHER_NAME:-usher}
    hostname: ${USHER_NAME:-usher}
    restart: unless-stopped
    environment:
      USHER_SECURITY: standard
      USHER_SITE_NAME: ${USHER_SITE_NAME:-}
      USHER_TIME_ZONE: ${USHER_TIME_ZONE:-}
      USHER_LANGUAGE: ${USHER_LANGUAGE:-}
      # Whether the unit is a demo, as packaging/docker/compose.yaml says it.
      USHER_DEMO: ${USHER_DEMO:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - kept:/var/lib/evo
    tmpfs:
      - /run/evo:mode=0755,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "/opt/evo/bin/evo-usher-steward", "--healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: httpd:2.4-alpine
    restart: unless-stopped
    # The proxy is started once the unit says it is up.
    depends_on:
      usher:
        condition: service_healthy
    ports:
      - ${SITE_ADDRESS:-0.0.0.0}:${SITE_PORT:-443}:443
    volumes:
      - ./usher.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ${SITE_CERT:-./site.crt}:/usher/site.crt:ro
      - ${SITE_KEY:-./site.key}:/usher/site.key:ro
      - ${USHER_AUTHORITY:-./unit-ca.crt}:/usher/unit-ca.crt:ro

volumes:
  kept:
