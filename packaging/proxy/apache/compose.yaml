# The usher behind Apache httpd, which holds the site's certificate and speaks
# HTTPS to the unit, believing it by the unit's own authority, though not by its name.
#
#   USHER_VERSION=<version> docker compose up -d usher
#   docker compose cp usher:/var/lib/evo/state/https/ca.crt ./unit-ca.crt
#   USHER_VERSION=<version> docker compose up -d
#
# beside the files `site.crt` and `site.key`. The unit makes its
# authority when it first starts, which is why it is started first.
# Whoever opens the face first sets the unit up, with a name and a
# password. docs/deploying.md says the rest.
#
#   USHER_VERSION       the version to run; there is no "latest"
#   USHER_IMAGE         the image, where it is not ghcr.io/foonerd/unifi-evo-usher
#   USHER_AUTHORITY     the unit's authority (default ./unit-ca.crt)
#   SITE_CERT, SITE_KEY the site's certificate and its key (default ./site.crt, ./site.key)
#   SITE_ADDRESS        the address the proxy is published on (default: every one)
#   SITE_PORT           the port it is published on (default 443)
services:
  usher:
    image: ${USHER_IMAGE:-ghcr.io/foonerd/unifi-evo-usher}:${USHER_VERSION:?name the version of the usher to run, as USHER_VERSION}
    restart: unless-stopped
    # The unit runs as the image's one account, numbered 10001, with no
    # capability, no way to gain a privilege, and a root file system it
    # cannot write to. What it keeps is in the volume `kept`, its people
    # among it; its client socket is in memory. Whoever opens a new unit
    # first sets it up, with a name and a password: it is run at the
    # ordinary level of security. packaging/docker/extended.yaml, named
    # after this file, runs it at the extended one.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - kept:/var/lib/evo
    tmpfs:
      - /run/evo:mode=0755,uid=10001,gid=10001

  proxy:
    image: httpd:2.4-alpine
    restart: unless-stopped
    depends_on:
      - usher
    ports:
      - ${SITE_ADDRESS:-0.0.0.0}:${SITE_PORT:-443}:443
    volumes:
      - ./usher.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ${SITE_CERT:-./site.crt}:/usher/site.crt:ro
      - ${SITE_KEY:-./site.key}:/usher/site.key:ro
      - ${USHER_AUTHORITY:-./unit-ca.crt}:/usher/unit-ca.crt:ro

volumes:
  kept:
