# What each widget kind of the pack promises a reader who does not see
# the screen, or does not use a pointer. What is pointed at or pressed
# fades into its state, and does not for a reader who asks for stillness.

["usher.controller"]
kind_id = "usher.controller"
aria_role = "region"
aria_label_source = "inner_text"
contrast = "aaa"
keyboard = { focusable = true, interactions = [] }
screen_reader = { announces = ["usher.controller.changed"] }
motion = { animates = true, honours_prefers_reduced_motion = true }

