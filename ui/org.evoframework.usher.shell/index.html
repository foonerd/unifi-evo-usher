<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Usher</title>
<link id="theme" rel="stylesheet" href="/org.evoframework.usher.theme.frost/theme.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="bar">
  <h1 class="brand" data-brand>Usher</h1>
  <button type="button" id="menu-button" class="quiet" aria-expanded="false" aria-controls="menu" data-say="shell.menu" hidden></button>
  <nav id="menu" data-say-label="shell.pages" hidden><ul></ul></nav>
  <div class="standing">
    <p id="line" role="status" data-say="shell.connecting"></p>
    <p id="who" hidden><span id="who-name"></span> <button type="button" id="sign-out" class="quiet" data-say="shell.sign_out"></button></p>
    <select id="language" class="language" data-say-label="language.label" hidden></select>
  </div>
</header>

<main id="shelves"></main>

<dialog id="entry" aria-labelledby="entry-title" closedby="none">
  <p class="brand" data-brand>Usher</p>
  <p class="entry-language" id="entry-language-part" hidden>
    <label for="entry-language" data-say="language.label"></label>
    <select id="entry-language" class="language"></select>
  </p>
  <div id="entry-form"></div>
</dialog>

<template id="set-up">
  <form id="set-up-form" novalidate>
    <h2 id="entry-title" data-say="entry.set_up_title"></h2>
    <p data-say="entry.set_up_intro"></p>
    <label for="set-up-name" data-say="entry.your_name"></label>
    <input id="set-up-name" name="name" type="text" autocomplete="username" autocapitalize="words" spellcheck="false" maxlength="64" required>
    <label for="set-up-password" data-say="entry.password"></label>
    <input id="set-up-password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
    <p class="hint" id="set-up-advice"></p>
    <label for="set-up-again" data-say="entry.password_again"></label>
    <input id="set-up-again" name="again" type="password" autocomplete="new-password" maxlength="128" required>
    <div id="set-up-code-part" hidden>
      <label for="set-up-code" data-say="entry.unit_code"></label>
      <input id="set-up-code" name="code" type="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false">
      <p class="hint" data-say="entry.unit_code_hint"></p>
    </div>
    <p class="said" id="set-up-said" role="alert"></p>
    <div class="row">
      <button type="submit" data-say="entry.set_up"></button>
    </div>
  </form>
</template>

<template id="sign-in">
  <form id="sign-in-form" novalidate>
    <h2 id="entry-title" data-say="entry.sign_in_title"></h2>
    <label for="sign-in-name" data-say="entry.name"></label>
    <input id="sign-in-name" name="name" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="64" required>
    <label for="sign-in-password" data-say="entry.password_or_pin"></label>
    <input id="sign-in-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <label class="check" for="sign-in-keep" id="sign-in-keep-part"><input id="sign-in-keep" name="keep" type="checkbox"> <span data-say="entry.keep"></span></label>
    <p class="said" id="sign-in-said" role="alert"></p>
    <div class="row">
      <button type="submit" data-say="entry.sign_in"></button>
    </div>
    <p class="hint" data-say="entry.forgotten"></p>
  </form>
</template>

<script type="module" src="shell.js"></script>
</body>
</html>
