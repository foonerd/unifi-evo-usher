<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Usher</title>
<link id="theme" rel="stylesheet" href="/org.evoframework.usher.theme.frost/theme.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="bar">
  <h1 class="brand" data-brand>Usher</h1>
  <button type="button" id="menu-button" class="quiet" aria-expanded="false" aria-controls="menu" hidden>Menu</button>
  <nav id="menu" aria-label="Pages" hidden><ul></ul></nav>
  <p id="line" role="status">Asking the steward.</p>
</header>

<main id="shelves"></main>

<dialog id="pairing" aria-labelledby="pairing-title">
  <form id="pairing-form" method="dialog">
    <p class="brand" data-brand>Usher</p>
    <h2 id="pairing-title">Pair this browser</h2>
    <p>The steward asks who is asking. Type the pairing code the unit was given before it was first started. A code pairs one browser, once, and a wrong guess spends it: look it over before it is sent.</p>
    <label for="pairing-code">Pairing code</label>
    <input id="pairing-code" name="code" type="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required>
    <p id="pairing-said" role="alert"></p>
    <div class="row">
      <button type="submit" value="pair">Pair</button>
      <button type="button" id="pairing-leave" class="quiet">Not now</button>
    </div>
  </form>
</dialog>

<script type="module" src="shell.js"></script>
</body>
</html>
