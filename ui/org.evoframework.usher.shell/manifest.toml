[plugin]
name = "org.evoframework.usher.shell"
# The workspace's version; a test holds the two together.
version = "0.3.22"
contract = 1
kind = "ui_shell"

[target]
shelf = "system.ui.shell"
shape = 1

[trust]
class = "unprivileged"

[prerequisites]
evo_min_version = "0.1.13"
os_family = "any"

[ui_shell]
display_name = "Usher"
shell_type = "web_bundle"
entry_point = "index.html"
required_widget_kinds = ["usher.*"]
supports_themes = true
supports_offline = false
min_evo_version = "0.1.13"
